<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Vocabulaire — French Vocabulary Trainer</title>
<style>
  :root{
    --cream:#f7f3ec;
    --ink:#242019;
    --navy:#1f3a5f;
    --navy-deep:#14283f;
    --red:#b23a2e;
    --gold:#c8952c;
    --line:#ded5c3;
    --card-bg:#ffffff;
    --muted:#736b5e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:2px solid var(--navy);
    padding-bottom:14px; margin-bottom:22px;
    flex-wrap:wrap; gap:8px;
  }
  header.top h1{
    font-size:28px; margin:0; font-weight:600; letter-spacing:0.2px;
    color:var(--navy-deep);
  }
  header.top h1 .accent{color:var(--red); font-style:italic;}
  header.top .stats{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px; color:var(--muted); text-align:right;
  }
  nav.tabs{
    display:flex; gap:4px; margin-bottom:24px;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  nav.tabs button{
    appearance:none; border:1px solid var(--line); background:transparent;
    padding:9px 18px; font-size:14px; cursor:pointer; color:var(--muted);
    border-radius:999px; transition:all .15s ease;
  }
  nav.tabs button.active{
    background:var(--navy-deep); color:#fff; border-color:var(--navy-deep);
  }
  nav.tabs button:hover:not(.active){border-color:var(--navy); color:var(--navy);}

  section{display:none;}
  section.active{display:block;}

  .panel{
    background:var(--card-bg); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 20px; margin-bottom:20px;
  }
  .controls-grid{
    display:grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
    gap:14px 18px; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px;
  }
  .controls-grid label{display:block; color:var(--muted); margin-bottom:5px; font-size:12px; text-transform:uppercase; letter-spacing:.04em;}
  .controls-grid select, .controls-grid input[type=text]{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; background:#fff; font-family:inherit; color:var(--ink);
  }
  .range-row{display:flex; align-items:center; gap:8px;}
  .range-row input[type=range]{flex:1;}
  .range-val{font-variant-numeric:tabular-nums; font-size:13px; color:var(--navy-deep); min-width:34px; text-align:right;}
  .radio-group{display:flex; gap:14px; font-size:14px; align-items:center; flex-wrap:wrap;}
  .radio-group label{display:flex; align-items:center; gap:5px; color:var(--ink); text-transform:none; font-size:14px;}
  .btn{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--navy-deep); color:#fff; border:none; padding:10px 22px;
    border-radius:999px; font-size:14px; cursor:pointer; transition:background .15s;
  }
  .btn:hover{background:var(--navy);}
  .btn.secondary{background:transparent; color:var(--navy-deep); border:1px solid var(--navy-deep);}
  .btn.secondary:hover{background:var(--navy-deep); color:#fff;}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}

  /* Flashcard */
  #flashArea{display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:6px;}
  .card-count{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:13px; color:var(--muted);
  }
  .flashcard{
    width:100%; max-width:480px; min-height:220px;
    background:#fff; border:1px solid var(--line); border-radius:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 26px; cursor:pointer; position:relative;
    box-shadow: 0 2px 0 var(--line);
  }
  .flashcard .tag{
    position:absolute; top:14px; left:18px;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:11px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase;
  }
  .flashcard .level-tag{
    position:absolute; top:14px; right:18px;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:11px; color:var(--gold); font-weight:600;
  }
  .flashcard .word{font-size:34px; color:var(--navy-deep); text-align:center; margin-bottom:10px;}
  .flashcard .word.hidden-word{color:var(--line); user-select:none;}
  .flashcard .gloss{font-size:18px; color:var(--muted); text-align:center; font-style:italic;}
  .flashcard .gloss.hidden-word{color:var(--line);}
  .flashcard .hint{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px; color:var(--line); margin-top:16px;
  }
  .flash-actions{display:flex; gap:12px;}
  .flash-actions button.miss{background:var(--red);}
  .flash-actions button.miss:hover{background:#8f2e24;}
  .flash-actions button.got{background:#3d7a4f;}
  .flash-actions button.got:hover{background:#2f6140;}
  .flash-nav{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; gap:8px; align-items:center;
  }

  /* Browse table */
  .table-controls{
    display:flex; gap:12px; margin-bottom:14px; flex-wrap:wrap; align-items:flex-end;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  table{width:100%; border-collapse:collapse; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px;}
  thead th{
    text-align:left; padding:8px 10px; border-bottom:2px solid var(--navy-deep);
    color:var(--navy-deep); cursor:pointer; user-select:none; font-size:12px; letter-spacing:.03em;
    text-transform:uppercase; white-space:nowrap;
  }
  thead th:hover{color:var(--red);}
  tbody td{padding:8px 10px; border-bottom:1px solid var(--line);}
  tbody tr:hover{background:#faf7f0;}
  td.fr{font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; font-size:16px; color:var(--navy-deep);}
  td.small{color:var(--muted); font-size:12px;}
  .pill{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px;
    background:#eee6d6; color:var(--navy-deep); white-space:nowrap;
  }
  .result-count{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:12px; color:var(--muted); margin:10px 0;
  }
  .empty-msg{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--muted); text-align:center; padding:40px 0; font-size:14px;
  }
  @media (max-width:600px){
    .flashcard{padding:24px 16px;}
    .flashcard .word{font-size:26px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mon <span class="accent">Vocabulaire</span></h1>
    <div class="stats" id="headerStats"></div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="flash">Flashcards</button>
    <button class="tab-btn" data-tab="browse">Browse</button>
  </nav>

  <section id="tab-flash" class="active">
    <div class="panel">
      <div class="controls-grid">
        <div>
          <label>Up to level</label>
          <div class="range-row">
            <input type="range" id="levelMax" min="1" max="302" value="302">
            <span class="range-val" id="levelMaxVal">302</span>
          </div>
        </div>
        <div>
          <label>Category</label>
          <select id="catFilter"><option value="">All categories</option></select>
        </div>
        <div>
          <label>Word type</label>
          <select id="typeFilter"><option value="">All types</option></select>
        </div>
        <div>
          <label>Show</label>
          <div class="radio-group">
            <label><input type="radio" name="hideMode" value="hideEn" checked> Hide English</label>
            <label><input type="radio" name="hideMode" value="hideFr"> Hide French</label>
            <label><input type="radio" name="hideMode" value="hideBoth"> Hide both</label>
          </div>
        </div>
      </div>
      <div style="margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn" id="startStudy">Start studying</button>
        <label style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="shuffleBox" checked> Shuffle
        </label>
        <label style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="missedOnlyBox"> Missed words only
        </label>
      </div>
    </div>

    <div id="flashArea"></div>
  </section>

  <section id="tab-browse">
    <div class="panel">
      <div class="table-controls">
        <div style="flex:1; min-width:180px;">
          <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Search</label>
          <input type="text" id="searchBox" placeholder="french or english…" style="width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:14px;">
        </div>
        <div>
          <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Category</label>
          <select id="browseCatFilter"><option value="">All</option></select>
        </div>
        <div>
          <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Type</label>
          <select id="browseTypeFilter"><option value="">All</option></select>
        </div>
        <div>
          <label style="display:block; font-size:12px; color:var(--muted); margin-bottom:4px;">Up to level</label>
          <input type="range" id="browseLevelMax" min="1" max="302" value="302">
        </div>
      </div>
      <div class="result-count" id="resultCount"></div>
      <div style="max-height:520px; overflow:auto;">
        <table>
          <thead>
            <tr>
              <th data-sort="fr">French</th>
              <th data-sort="en">English</th>
              <th data-sort="level">Level</th>
              <th data-sort="cat">Category</th>
              <th data-sort="type">Type</th>
            </tr>
          </thead>
          <tbody id="browseBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

// ---------- setup ----------
const STORAGE_KEY_PROGRESS = "progress"; // {fr: {miss:n, seen:n}}
let progress = {};

function saveProgress(){
  window.storage && window.storage.set(STORAGE_KEY_PROGRESS, JSON.stringify(progress), false).catch(()=>{});
}
async function loadProgress(){
  try{
    if(!window.storage) return;
    const r = await window.storage.get(STORAGE_KEY_PROGRESS, false);
    if(r && r.value) progress = JSON.parse(r.value);
  }catch(e){ /* no saved progress yet */ }
}

const categories = Array.from(new Set(VOCAB_DATA.map(d=>d.cat))).sort();
const types = Array.from(new Set(VOCAB_DATA.map(d=>d.type))).sort();
const maxLevel = Math.max(...VOCAB_DATA.map(d=>d.level));

function populateSelect(sel, items){
  items.forEach(it=>{
    const o = document.createElement("option");
    o.value = it; o.textContent = it;
    sel.appendChild(o);
  });
}
populateSelect(document.getElementById("catFilter"), categories);
populateSelect(document.getElementById("typeFilter"), types);
populateSelect(document.getElementById("browseCatFilter"), categories);
populateSelect(document.getElementById("browseTypeFilter"), types);

["levelMax","browseLevelMax"].forEach(id=>{
  document.getElementById(id).max = maxLevel;
  document.getElementById(id).value = maxLevel;
});
document.getElementById("levelMaxVal").textContent = maxLevel;
document.getElementById("levelMax").addEventListener("input", e=>{
  document.getElementById("levelMaxVal").textContent = e.target.value;
});

function updateHeaderStats(){
  const totalSeen = Object.keys(progress).length;
  const totalMiss = Object.values(progress).filter(p=>p.miss>0).length;
  document.getElementById("headerStats").textContent =
    `${VOCAB_DATA.length} words · ${maxLevel} levels · ${totalSeen} studied so far`;
}

  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
    if(btn.dataset.tab === "browse") renderBrowse();
  });
});

// ---------- flashcards ----------
let queue = [];
let qi = 0;
let curHideMode = "hideEn";

function buildQueue(){
  const lvl = parseInt(document.getElementById("levelMax").value,10);
  const cat = document.getElementById("catFilter").value;
  const typ = document.getElementById("typeFilter").value;
  const missedOnly = document.getElementById("missedOnlyBox").checked;
  const shuffle = document.getElementById("shuffleBox").checked;
  curHideMode = document.querySelector('input[name="hideMode"]:checked').value;

  let pool = VOCAB_DATA.filter(d=>d.level<=lvl);
  if(cat) pool = pool.filter(d=>d.cat===cat);
  if(typ) pool = pool.filter(d=>d.type===typ);
  if(missedOnly) pool = pool.filter(d=>progress[d.fr] && progress[d.fr].miss>0);

  pool = pool.slice();
  if(shuffle){
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
  }
  return pool;
}

document.getElementById("startStudy").addEventListener("click", ()=>{
  queue = buildQueue();
  qi = 0;
  renderCard();
});

function renderCard(){
  const area = document.getElementById("flashArea");
  if(queue.length === 0){
    area.innerHTML = '<div class="empty-msg">No words match these filters. Try widening your level range or category.</div>';
    return;
  }
  if(qi >= queue.length){
    area.innerHTML = '<div class="empty-msg">Session complete — nice work.<br><br></div>';
    const btn = document.createElement("button");
    btn.className = "btn secondary";
    btn.textContent = "Study again";
    btn.addEventListener("click", ()=>{ qi=0; renderCard(); });
    area.querySelector(".empty-msg").appendChild(btn);
    return;
  }
  const item = queue[qi];
  const revealed = area.dataset.revealed === "1" && area.dataset.forWord === item.fr;

  const hideFr = curHideMode === "hideFr" || curHideMode === "hideBoth";
  const hideEn = curHideMode === "hideEn" || curHideMode === "hideBoth";

  const frHidden = hideFr && !revealed;
  const enHidden = hideEn && !revealed;

  area.innerHTML = `
    <div class="card-count">${qi+1} / ${queue.length}</div>
    <div class="flashcard" id="cardEl">
      <span class="tag">${item.cat}</span>
      <span class="level-tag">Lv ${item.level}</span>
      <div class="word ${frHidden ? 'hidden-word':''}">${frHidden ? '?????' : item.fr}</div>
      <div class="gloss ${enHidden ? 'hidden-word':''}">${enHidden ? '?????' : item.en}</div>
      <div class="hint">${(hideFr||hideEn) ? 'tap card to reveal' : ''}</div>
    </div>
    <div class="flash-actions">
      <button class="miss">Missed it</button>
      <button class="got">Got it</button>
    </div>
    <div class="flash-nav">
      <button class="btn ghost" id="skipBtn">Skip</button>
    </div>
  `;
  area.dataset.revealed = "0";
  area.dataset.forWord = item.fr;

  document.getElementById("cardEl").addEventListener("click", ()=>{
    area.dataset.revealed = "1";
    renderCard();
  });
  area.querySelector(".miss").addEventListener("click", (e)=>{
    e.stopPropagation();
    markWord(item.fr, false);
    qi++; renderCard();
  });
  area.querySelector(".got").addEventListener("click", (e)=>{
    e.stopPropagation();
    markWord(item.fr, true);
    qi++; renderCard();
  });
  document.getElementById("skipBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    qi++; renderCard();
  });
}

function markWord(fr, gotIt){
  if(!progress[fr]) progress[fr] = {miss:0, seen:0};
  progress[fr].seen++;
  if(!gotIt) progress[fr].miss++;
  else progress[fr].miss = Math.max(0, progress[fr].miss-1);
  saveProgress();
  updateHeaderStats();
}

// initial empty state
document.getElementById("flashArea").innerHTML = '<div class="empty-msg">Set your filters above and press "Start studying".</div>';

// ---------- browse ----------
let sortKey = "level";
let sortAsc = true;

function renderBrowse(){
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const cat = document.getElementById("browseCatFilter").value;
  const typ = document.getElementById("browseTypeFilter").value;
  const lvl = parseInt(document.getElementById("browseLevelMax").value,10);

  let rows = VOCAB_DATA.filter(d=>d.level<=lvl);
  if(cat) rows = rows.filter(d=>d.cat===cat);
  if(typ) rows = rows.filter(d=>d.type===typ);
  if(q) rows = rows.filter(d=> d.fr.toLowerCase().includes(q) || d.en.toLowerCase().includes(q));

  rows = rows.slice().sort((a,b)=>{
    let av = a[sortKey], bv = b[sortKey];
    if(typeof av === "string"){ av = av.toLowerCase(); bv = bv.toLowerCase(); }
    if(av < bv) return sortAsc ? -1 : 1;
    if(av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  document.getElementById("resultCount").textContent = `${rows.length} words`;

  const body = document.getElementById("browseBody");
  const MAX_RENDER = 500;
  const shown = rows.slice(0, MAX_RENDER);
  body.innerHTML = shown.map(d=>`
    <tr>
      <td class="fr">${d.fr}</td>
      <td>${d.en}</td>
      <td class="small">${d.level} · ${d.skill||''}</td>
      <td class="small"><span class="pill">${d.cat}</span></td>
      <td class="small">${d.type}</td>
    </tr>
  `).join("");
  if(rows.length > MAX_RENDER){
    body.innerHTML += `<tr><td colspan="5" class="small" style="text-align:center; padding:14px;">…and ${rows.length-MAX_RENDER} more. Narrow your search to see them.</td></tr>`;
  }
}

document.querySelectorAll("th[data-sort]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const key = th.dataset.sort;
    if(sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    renderBrowse();
  });
});
["searchBox","browseCatFilter","browseTypeFilter","browseLevelMax"].forEach(id=>{
  document.getElementById(id).addEventListener("input", renderBrowse);
});

// ---------- init ----------
(async function init(){
  await loadProgress();
  updateHeaderStats();
})();
</script>
